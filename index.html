<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Real Estate Extractor // Premium Sync</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { 
            --bg: #F2F2F7; 
            --panel: #FFFFFF; 
            --text-main: #000000; 
            --text-muted: #3C3C4399; 
            --accent: #007AFF; 
            --border: rgba(60, 60, 67, 0.15);
            --border-light: rgba(60, 60, 67, 0.08);
            --whatsapp: #34C759;
            --danger: #FF3B30; 
            --warning: #FF9500;
            --school: #AF52DE;
            --teal: #5AC8FA;
            --badge-bg: rgba(118, 118, 128, 0.12);
            --input-bg: #FFFFFF;
        }

        body.dark-mode {
            --bg: #000000; 
            --panel: #1C1C1E; 
            --text-main: #FFFFFF; 
            --text-muted: #EBEBF599; 
            --border: rgba(235, 235, 245, 0.15);
            --border-light: rgba(235, 235, 245, 0.08);
            --accent: #0A84FF; 
            --whatsapp: #30D158;
            --danger: #FF453A; 
            --warning: #FF9F0A;
            --school: #BF5AF2;
            --teal: #64D2FF;
            --badge-bg: rgba(235, 235, 245, 0.12);
            --input-bg: #1C1C1E;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif; -webkit-tap-highlight-color: transparent; }
        html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        body { background: var(--bg); color: var(--text-main); padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px) 20px; line-height: 1.4; transition: background 0.25s, color 0.25s; letter-spacing: -0.01em; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5px solid var(--border); padding-bottom: 14px; }
        h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
        
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .status-badge { background: transparent; color: var(--text-muted); padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 500; border: 0.5px solid var(--border); transition: all 0.3s; }
        
        .cloud-sync-wrap { position: relative; display: flex; align-items: center; gap: 4px; }
        .btn-cloud-sync { background: var(--badge-bg); border: none; color: var(--text-main); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; transition: transform 0.2s; }
        .btn-cloud-sync:active { transform: scale(0.9); }
        .btn-cloud-sync.spinning { animation: spin 0.8s linear infinite; color: var(--whatsapp); }
        .sync-dot { position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg); background: var(--text-muted); transition: background 0.2s; }
        .sync-dot.dot-synced { background: var(--whatsapp); }
        .sync-dot.dot-pending { background: var(--warning); }
        .sync-dot.dot-error { background: var(--danger); }
        .sync-dot.dot-nocreds { background: var(--text-muted); }
        @keyframes spin { to { transform: rotate(360deg); } }

        #themeToggle { background: var(--badge-bg); border: none; border-radius: 50%; font-size: 1rem; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); transition: transform 0.2s; }
        #themeToggle:active { transform: scale(0.9); }

        .panel { background: var(--panel); padding: 16px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 20px; border: 0.5px solid var(--border-light); }
        .panel p { color: var(--text-muted); font-size: 0.8rem; font-weight: 500; margin-bottom: 12px; }
        
        .input-group { display: flex; gap: 8px; flex-wrap: wrap; }
        input, select, button { padding: 10px 14px; min-height: 44px; border: 0.5px solid var(--border); border-radius: 12px; font-size: 0.9rem; outline: none; background: var(--badge-bg); color: var(--text-main); font-weight: 500; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: var(--accent); background: var(--input-bg); }
        .input-group input { flex-grow: 1; min-width: 200px; margin: 0; }
        .input-group button { width: auto; margin: 0; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; border: none; padding: 0 16px; }
        .input-group button:active { opacity: 0.8; }
        .input-group button:disabled { background: var(--text-muted); opacity: 0.5; cursor: not-allowed; }
        
        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; max-width: 400px; padding: 0 15px; pointer-events: none; }
        .toast { background: rgba(28, 28, 30, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 0.5px solid rgba(255,255,255,0.1); color: #FFF; font-size: 0.85rem; font-weight: 500; padding: 12px 18px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); opacity: 0; transform: translateY(-12px); transition: opacity 0.3s, transform 0.3s; text-align: center; }
        .toast.show { opacity: 1; transform: translateY(0); }
        body:not(.dark-mode) .toast { background: rgba(255, 255, 255, 0.95); color: #000; border: 0.5px solid rgba(0,0,0,0.1); }
        
        .filters-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; align-items: center; }
        .filters-grid input { flex: 1 1 100%; }
        .filters-grid select { flex: 1 1 calc(33% - 8px); cursor: pointer; }
        
        .btn-glass { border: none; font-weight: 600; font-size: 0.85rem; min-height: 44px; padding: 8px 14px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: opacity 0.2s; flex: 1 1 auto; }
        .btn-glass:active { opacity: 0.7; }
        
        .btn-select-all { background: rgba(10, 132, 255, 0.12); color: var(--accent); }
        .btn-map { background: rgba(90, 200, 250, 0.12); color: var(--teal); }
        .btn-itinerary { background: rgba(48, 209, 88, 0.12); color: var(--whatsapp); }

        .list-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        
        .card { background: var(--panel); border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.03); display: flex; flex-direction: column; border: 0.5px solid var(--border-light); overflow: hidden; position: relative; transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,0.08); }
        
        .card-img { width: 100%; height: 160px; object-fit: cover; background: var(--badge-bg); border-bottom: 0.5px solid var(--border-light); }
        .card-content { padding: 14px 16px; display: flex; flex-direction: column; flex-grow: 1; }
        
        .card-header { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start; }
        .prop-title { font-size: 0.95rem; font-weight: 700; color: var(--text-main); margin-bottom: 2px; letter-spacing: 0.01em; text-transform: capitalize; }
        .prop-address { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; cursor: pointer; transition: color 0.2s; }
        .prop-address:hover { color: var(--accent); }
        
        .star-rating { display: flex; gap: 2px; font-size: 1rem; cursor: pointer; }
        .star { color: var(--star-inactive); transition: color 0.15s; }
        .star.active { color: var(--warning); }

        .metrics-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .badge { background: var(--badge-bg); padding: 4px 8px; min-height: 28px; border-radius: 8px; font-size: 0.75rem; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .badge strong { color: var(--text-main); font-weight: 600; }
        
        .badge.highlight { background: rgba(10, 132, 255, 0.06); color: var(--accent); width: 100%; justify-content: space-between; padding: 10px 12px; align-items: flex-start; border-radius: 12px; min-height: auto; }
        .badge.highlight span { font-weight: 600; font-size: 0.8rem; }
        .badge.highlight strong { color: var(--accent); font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
        .badge-usd-sub { display: block; font-size: 0.75rem; font-weight: 600; opacity: 0.8; margin-top: 1px;}
        
        .badge-interactive { cursor: pointer; transition: opacity 0.2s; width: 100%; justify-content: space-between; padding: 8px 12px; background: var(--badge-bg); border-radius: 10px; }
        .badge-interactive:active { opacity: 0.6; }

        .entry-costs { margin-top: 4px; background: var(--badge-bg); border-radius: 12px; font-size: 0.75rem; color: var(--text-main); overflow: hidden; }
        .entry-costs h4 { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; padding: 10px 12px; background: rgba(0,0,0,0.02); border-bottom: 0.5px solid var(--border-light); text-transform: uppercase; letter-spacing: 0.03em; }
        body.dark-mode .entry-costs h4 { background: rgba(255,255,255,0.02); }
        .cost-item { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 0.5px solid var(--border-light); font-weight: 500; }
        .cost-item:last-child { border-bottom: none; }
        .cost-item-total { font-weight: 700; color: var(--accent); background: rgba(10, 132, 255, 0.04); }

        .itinerary-toggle { margin-top: 12px; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 500; cursor: pointer; color: var(--text-main); min-height: 44px; }
        .itinerary-toggle input { margin: 0; width: 18px; height: 18px; accent-color: var(--whatsapp); cursor: pointer; }

        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; border-top: 0.5px solid var(--border-light); padding-top: 12px; }
        .action-btn, .link-btn, .wa-btn, .school-btn { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 0.75rem; font-weight: 600; text-transform: none; letter-spacing: -0.01em; padding: 4px; min-height: 36px; border-radius: 10px; text-decoration: none; cursor: pointer; border: 0.5px solid transparent; width: 100%; transition: all 0.2s; }
        .action-btn:active, .link-btn:active, .wa-btn:active, .school-btn:active { transform: scale(0.96); }
        
        .wa-btn { color: var(--whatsapp); border-color: rgba(48,209,88,0.3); background: rgba(48,209,88,0.06); }
        .school-btn { color: var(--school); border-color: rgba(191,90,242,0.3); background: rgba(191,90,242,0.06); }
        .link-btn { color: var(--text-main); border-color: var(--border); background: var(--badge-bg); }
        .edit-btn { color: var(--warning); border-color: rgba(255,159,10,0.3); background: rgba(255,159,10,0.06); }
        .delete-btn { color: var(--danger); border-color: rgba(255,69,58,0.3); background: rgba(255,69,58,0.06); }

        .settings-footer { margin-top: 30px; padding-top: 20px; border-top: 0.5px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .backup-actions { display: flex; gap: 10px; justify-content: center; width: 100%; max-width: 500px; }
        .btn-sync { background: rgba(175, 82, 222, 0.12); color: var(--school); width: 100%; max-width: 500px; }
        .btn-import-export { background: var(--badge-bg); color: var(--text-muted); flex: 1; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 2000; justify-content: center; align-items: flex-end; padding: 0; }
        @media (min-width: 768px) { .modal-overlay { align-items: center; padding: 20px; } }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--panel); width: 100%; max-width: 1100px; height: 90vh; display: flex; flex-direction: column; overflow: hidden; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        @media (min-width: 768px) { .modal-content { border-radius: 16px; transform: translateY(20px); border: 0.5px solid var(--border); } }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        .modal-header { padding: 16px 20px; border-bottom: 0.5px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; background: var(--panel); }
        .modal-header h2 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.01em; }
        .close-modal { background: var(--badge-bg); border: none; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; color: var(--text-muted); transition: background 0.2s; }
        .close-modal:active { background: var(--border); }
        #mapContainer { flex-grow: 1; width: 100%; height: 100%; background: var(--bg); min-height: 50vh; }

        @media (max-width: 600px) {
            .input-group button { width: 100%; }
            .filters-grid input { flex: 1 1 100%; }
            .filters-grid select { flex: 1 1 100%; }
            .filters-grid button { width: 100%; }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="toast-container" id="toastContainer"></div>

    <div class="container">
        <header>
            <h1>
                Real Estate Sync
                <div class="cloud-sync-wrap">
                    <button class="btn-cloud-sync" id="btnCloudSync" onclick="manualSync()" title="Sincronizar">🔄</button>
                    <span class="sync-dot" id="syncDot"></span>
                </div>
            </h1>
            <div class="header-actions">
                <button id="themeToggle" title="Toggle Theme">🌓</button>
            </div>
        </header>
        
        <div class="panel">
            <p>Ingresa la URL de la publicación (ZonaProp, DIC Propiedades o MercadoLibre)</p>
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="https://..." autocomplete="off" />
                <button id="extractBtn">Extraer</button>
            </div>
        </div>

        <div class="filters-grid">
            <input type="text" id="filterText" placeholder="Filtrar dirección o tipo..." autocomplete="off">
            <select id="filterType">
                <option value="ALL">Tipos (Todos)</option>
                <option value="DEPARTAMENTO">Departamento</option>
                <option value="CASA">Casa</option>
                <option value="PH">PH</option>
                <option value="LOTE">Lote / Terreno</option>
            </select>
            <select id="filterCurrency">
                <option value="ALL">Moneda (Todas)</option>
                <option value="ARS">Pesos ($)</option>
                <option value="USD">Dólares (USD)</option>
            </select>
            <select id="sortType">
                <option value="date_desc">Más recientes</option>
                <option value="ranking_desc">Ranking ⭐</option>
                <option value="dist_asc">Distancia Colegio 📍</option>
                <option value="price_asc">Precio (Menor a Mayor)</option>
                <option value="price_desc">Precio (Mayor a Menor)</option>
            </select>
            
            <button class="btn-glass btn-select-all" onclick="selectAllItinerary()">☑️ Incluir Todos</button>
            <button class="btn-glass btn-map" onclick="openMapModal()">🗺️ Mapa</button>
            <button class="btn-glass btn-itinerary" onclick="generateItineraryMapsLink()">🚗 Ruta GPS (<span id="itineraryCount">0</span>)</button>
        </div>

        <div class="list-container" id="inventoryList"></div>

        <div class="settings-footer">
            <button class="btn-glass btn-sync" onclick="forceSetupCredentials()">⚙️ Configurar Nube (GitHub)</button>
            <div class="backup-actions">
                <button class="btn-glass btn-import-export" onclick="exportJsonLocal()">⬇️ Exportar JSON</button>
                <button class="btn-glass btn-import-export" onclick="document.getElementById('fileImport').click()">⬆️ Importar JSON</button>
            </div>
            <input type="file" id="fileImport" accept=".json" style="display:none;" onchange="importJsonLocal(this)">
        </div>
    </div>

    <!-- MAP MODAL -->
    <div class="modal-overlay" id="mapModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Ubicaciones</h2>
                <button class="close-modal" onclick="closeMapModal()">✕</button>
            </div>
            <div id="mapContainer"></div>
        </div>
    </div>

    <script>
        const bakedProperties = []; 

        function toast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.textContent = message;
            container.appendChild(el);
            requestAnimationFrame(() => el.classList.add('show'));
            setTimeout(() => {
                el.classList.remove('show');
                setTimeout(() => el.remove(), 250);
            }, duration);
        }

        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'light') document.body.classList.remove('dark-mode');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        });

        const btn = document.getElementById('extractBtn');
        const urlInput = document.getElementById('urlInput');
        const list = document.getElementById('inventoryList');
        
        const filterText = document.getElementById('filterText');
        const filterType = document.getElementById('filterType');
        const filterCurrency = document.getElementById('filterCurrency');
        const sortType = document.getElementById('sortType');

        let globalState = { updatedAt: 0, properties: [] };
        let itineraryIds = new Set();
        let dolarBlueRate = 1300; 

        let mapInstance = null;
        let markersGroup = null;

        let pushDebounceTimer = null;
        let hasUnsyncedChanges = false;
        let lastKnownCloudUpdatedAt = 0;
        let lastSyncHadError = false;
        let isSyncingLock = false;
        let isFreshInstall = !localStorage.getItem('re_global_state');

        (async function initApp() {
            loadLocalDb();
            renderList();
            fetchDolarRate();
            setTimeout(() => { autoPullFromCloud(); }, 100);
        })();

        async function fetchDolarRate() {
            try {
                const res = await fetch('https://dolarapi.com/v1/dolares/blue');
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.venta) {
                        dolarBlueRate = data.venta;
                        renderList();
                    }
                }
            } catch(e) {}
        }

        [filterText, filterType, filterCurrency, sortType].forEach(el => {
            el.addEventListener('input', renderList);
            el.addEventListener('change', renderList);
        });

        function loadLocalDb() {
            const raw = localStorage.getItem('re_global_state');
            if (raw) {
                try { 
                    globalState = JSON.parse(raw); 
                    if (!globalState.properties) globalState.properties = [];
                } catch(e) { globalState = { updatedAt: Date.now(), properties: bakedProperties || [] }; }
            } else {
                globalState = { updatedAt: Date.now(), properties: bakedProperties || [] };
            }
        }

        function saveLocalDb() {
            globalState.updatedAt = Date.now();
            localStorage.setItem('re_global_state', JSON.stringify(globalState));
            hasUnsyncedChanges = true;
            updateSyncStatus();
            scheduleCloudPush();
        }

        function exportJsonLocal() {
            const blob = new Blob([JSON.stringify(globalState.properties, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `propiedades_backup.json`;
            a.click();
        }

        function importJsonLocal(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed)) {
                        globalState.properties = parsed;
                        globalState.updatedAt = Date.now();
                    } else if (parsed.properties && Array.isArray(parsed.properties)) {
                        globalState = parsed;
                        if (!globalState.updatedAt) globalState.updatedAt = Date.now();
                    } else {
                        throw new Error("Formato inválido");
                    }
                    saveLocalDb();
                    renderList();
                    toast("✅ Importado. Tocá 🔄 para subir.", "success");
                } catch(err) {
                    toast("❌ Error al leer el archivo JSON.", "error");
                }
                input.value = '';
            };
            reader.readAsText(file);
        }

        function getSyncCredentials() {
            let token = localStorage.getItem('re_gh_token');
            let gistId = localStorage.getItem('re_gh_gist');
            return { token, gistId };
        }

        async function forceSetupCredentials() {
            const current = getSyncCredentials();
            const token = prompt("GitHub PAT (permiso 'gist'):", current.token || '');
            if (token === null) return;
            const gistId = prompt("ID del Gist:", current.gistId || '');
            if (gistId === null) return;
            if (!token.trim() || !gistId.trim()) {
                toast("Faltan datos.", "error");
                return;
            }
            localStorage.setItem('re_gh_token', token.trim());
            localStorage.setItem('re_gh_gist', gistId.trim());
            toast('Credenciales guardadas.', 'info');
            await manualSync();
        }

        function scheduleCloudPush() {
            clearTimeout(pushDebounceTimer);
            pushDebounceTimer = setTimeout(async () => {
                const result = await autoPushToCloud();
                if(result.ok) {
                    hasUnsyncedChanges = false;
                    lastSyncHadError = false;
                } else if(result.conflict) {
                    toast('Versión más nueva en la nube. Tocá 🔄.', 'warning');
                } else if(!result.noCreds && !result.offline) {
                    lastSyncHadError = true;
                }
                updateSyncStatus();
            }, 1500);
        }

        function updateSyncStatus() {
            const dot = document.getElementById('syncDot');
            if(!dot) return;
            const creds = getSyncCredentials();
            dot.classList.remove('dot-synced', 'dot-pending', 'dot-error', 'dot-nocreds');
            if(!creds.token || !creds.gistId) {
                dot.classList.add('dot-nocreds');
                dot.title = 'Sin credenciales';
            } else if(!navigator.onLine) {
                dot.classList.add('dot-pending');
                dot.title = 'Offline';
            } else if(lastSyncHadError) {
                dot.classList.add('dot-error');
                dot.title = 'Error en sincronización';
            } else if(hasUnsyncedChanges) {
                dot.classList.add('dot-pending');
                dot.title = 'Cambios pendientes';
            } else {
                dot.classList.add('dot-synced');
                dot.title = 'Sincronizado';
            }
        }

        async function autoPullFromCloud(isForcedManual = false) {
            if (!navigator.onLine && !isForcedManual) return { ok: false, offline: true };
            if(isSyncingLock && !isForcedManual) return { ok: false };
            
            const creds = getSyncCredentials();
            if(!creds.token || !creds.gistId) return { ok: false, noCreds: true };
            
            isSyncingLock = true;
            const syncBtn = document.getElementById('btnCloudSync');
            if(syncBtn) syncBtn.classList.add('spinning');
            
            try {
                const res = await fetch(`https://api.github.com/gists/${creds.gistId}?_cb=${Date.now()}`, {
                    method: 'GET',
                    headers: { 'Authorization': `token ${creds.token}` }
                });
                if(!res.ok) return { ok: false };

                const gistData = await res.json();
                if(!gistData.files || !gistData.files["re_inventory.json"]) return { ok: true, adopted: false };

                const cloudContent = JSON.parse(gistData.files["re_inventory.json"].content);
                const cloudUpdatedAt = cloudContent.updatedAt || 0;
                lastKnownCloudUpdatedAt = Math.max(lastKnownCloudUpdatedAt, cloudUpdatedAt);

                if(cloudUpdatedAt > globalState.updatedAt || (isFreshInstall && cloudContent.properties && cloudContent.properties.length > 0)) {
                    globalState = cloudContent;
                    localStorage.setItem('re_global_state', JSON.stringify(globalState));
                    isFreshInstall = false;
                    hasUnsyncedChanges = false;
                    renderList();
                    return { ok: true, adopted: true };
                }
                return { ok: true, adopted: false };
            } catch(e) {
                return { ok: false, offline: !navigator.onLine };
            } finally {
                isSyncingLock = false;
                if(syncBtn) syncBtn.classList.remove('spinning');
                updateSyncStatus();
            }
        }

        async function autoPushToCloud(bypassLock = false, skipConflictCheck = false) {
            if (!navigator.onLine && !bypassLock) return { ok: false, offline: true };
            if(isSyncingLock && !bypassLock) return { ok: false };
            
            const creds = getSyncCredentials();
            if(!creds.token || !creds.gistId) return { ok: false, noCreds: true };
            
            isSyncingLock = true;
            const syncBtn = document.getElementById('btnCloudSync');
            if(syncBtn) syncBtn.classList.add('spinning');
            
            try {
                if(!skipConflictCheck) {
                    try {
                        const checkRes = await fetch(`https://api.github.com/gists/${creds.gistId}?_cb=${Date.now()}`, {
                            method: 'GET',
                            headers: { 'Authorization': `token ${creds.token}` }
                        });
                        if(checkRes.ok) {
                            const checkData = await checkRes.json();
                            if(checkData.files && checkData.files["re_inventory.json"]) {
                                const cloudNow = JSON.parse(checkData.files["re_inventory.json"].content);
                                const cloudNowUpdatedAt = cloudNow.updatedAt || 0;
                                if(cloudNowUpdatedAt > lastKnownCloudUpdatedAt && cloudNowUpdatedAt !== globalState.updatedAt) {
                                    return { ok: false, conflict: true };
                                }
                            }
                        }
                    } catch(e) { }
                }

                const res = await fetch(`https://api.github.com/gists/${creds.gistId}`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `token ${creds.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        files: { "re_inventory.json": { content: JSON.stringify(globalState, null, 2) } }
                    })
                });
                if(!res.ok) return { ok: false };
                lastKnownCloudUpdatedAt = globalState.updatedAt;
                return { ok: true };
            } catch(e) { 
                return { ok: false, offline: !navigator.onLine };
            } finally { 
                isSyncingLock = false;
                if(syncBtn) syncBtn.classList.remove('spinning'); 
                updateSyncStatus();
            }
        }

        async function manualSync() {
            if (!navigator.onLine) { toast('No hay conexión a internet.', 'error'); return; }
            const creds = getSyncCredentials();
            if(!creds.token || !creds.gistId) { await forceSetupCredentials(); return; }
            
            clearTimeout(pushDebounceTimer);
            const pullResult = await autoPullFromCloud(true);
            if(!pullResult.ok) {
                lastSyncHadError = true; updateSyncStatus();
                toast(`Error al descargar.`, 'error');
                return;
            }
            if(pullResult.adopted) {
                lastSyncHadError = false;
                toast('Actualizado desde la nube.', 'success');
                return;
            }
            const pushResult = await autoPushToCloud(true, true);
            if(!pushResult.ok) {
                lastSyncHadError = true; updateSyncStatus();
                toast(`Error al subir.`, 'error');
                return;
            }
            hasUnsyncedChanges = false;
            lastSyncHadError = false;
            updateSyncStatus();
            toast('Sincronizado.', 'success');
        }

        async function fetchPropertyHtml(targetUrl) {
            const proxies = [
                u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
                u => `https://corsproxy.io/?${encodeURIComponent(u)}`
            ];
            for (let proxyFn of proxies) {
                try {
                    const res = await fetch(proxyFn(targetUrl));
                    if (res.ok) {
                        const text = await res.text();
                        if (text && text.length > 500) return text;
                    }
                } catch(e) {}
            }
            throw new Error("Proxy bloqueado por CORS.");
        }

        function extractPropertyData(text, url) {
            const id = 'id_' + Math.random().toString(36).substr(2, 9);
            let tipo = "Inmueble", direccion = "Dirección no especificada", precio = "Consultar", expensas = "";
            let ambientes = "", dormitorios = "", banos = "", cocheras = "", metros_tot = "", metros_cub = "", latitude = "", longitude = "", imagen = "";

            const urlLower = url.toLowerCase();

            if (urlLower.includes("mercadolibre.com") || urlLower.includes("mercadolivre.com")) {
                const schemaMatch = text.match(/<script\s+type="application\/ld\+json"[^>]*>(.*?)<\/script>/is);
                if (schemaMatch) {
                    try {
                        const sJson = JSON.parse(schemaMatch[1]);
                        if (sJson.image) imagen = sJson.image;
                        if (sJson.offers && sJson.offers.price) precio = `${sJson.offers.priceCurrency || 'USD'} ${sJson.offers.price}`.trim();
                    } catch(e){}
                }

                const labelLocMatch = text.match(/"target"\s*:\s*"location_and_points"[^}]+?"text"\s*:\s*"([^"]+)"/i);
                if (labelLocMatch) direccion = labelLocMatch[1].trim();
                else {
                    const addrM = text.match(/"item_address"\s*:\s*"([^"]+)"/i);
                    const locM = text.match(/"item_location"\s*:\s*"([^"]+)"/i);
                    if (addrM) {
                        direccion = addrM[1].trim();
                        if (locM && !direccion.toLowerCase().includes(locM[1].split(',')[0].toLowerCase())) direccion += `, ${locM[1].split(',')[0].trim()}`;
                    }
                }

                const latM = text.match(/"latitude"\s*:\s*"?(-?\d+\.\d+)"?/i);
                const lngM = text.match(/"longitude"\s*:\s*"?(-?\d+\.\d+)"?/i);
                if (latM && lngM) { latitude = latM[1]; longitude = lngM[1]; }
            }

            const cleanText = text.replace(/<(script|style)[^>]*>.*?<\/\1>/gis, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');

            const tipoM = cleanText.match(/\b(departamento|casa|ph|lote|terreno)\b/i);
            if (tipoM) tipo = tipoM[1].charAt(0).toUpperCase() + tipoM[1].slice(1);

            const totM = cleanText.match(/(\d+)\s*m²\s*totales/i);
            if (totM) metros_tot = totM[1];

            const ambM = cleanText.match(/(\d+)\s*ambientes/i);
            if (ambM) ambientes = ambM[1];

            const dormM = cleanText.match(/(\d+)\s*dormitorios?/i) || cleanText.match(/(\d+)\s*dorm/i);
            if (dormM) dormitorios = dormM[1];

            const banosM = cleanText.match(/(\d+)\s*baños?/i);
            if (banosM) banos = banosM[1];

            const expM = cleanText.match(/expensas.{0,15}?([U\$S|USD|ARS|\$]{1,3}\s*[\d\.\,]+)/i);
            if (expM) expensas = expM[1].trim();

            if (!imagen) {
                const imgM = text.match(/property="og:image"\s+content="([^"]+)"/i);
                if (imgM) imagen = imgM[1];
            }

            return { id, tipo, direccion, precio, expensas, ambientes, dormitorios, banos, cocheras, metros_tot, metros_cub, distancia_cole: "", tiempo_cole: "", ranking: 0, latitude, longitude, imagen, url };
        }

        function openAddressInGoogleMaps(address) {
            let a = address.replace(/\b[a-zA-Z]\d{4}[a-zA-Z]{0,3}\b/g, '').replace(/\s+/g, ' ').trim();

        function isCabaAddress(direccionStr) {
            if (!direccionStr) return false;
            const str = direccionStr.toLowerCase();
            return str.includes("caba") || str.includes("capital federal") || str.includes("ciudad autónoma") || str.includes("capital");
        }

        function sanitizeAddressForGeocoding(addr, level = 0) {
            if (!addr || addr === "Dirección no especificada") return "";
            let clean = addr;

            clean = clean.replace(/\b[a-zA-Z]\d{4}[a-zA-Z]{0,3}\b/g, '');
            clean = clean.replace(/\bC\.\s*/gi, 'Calle ');
            clean = clean.replace(/\bC\/\s*/gi, 'Calle ');
            clean = clean.replace(/\bCdad\.\s*/gi, 'Ciudad ');
            clean = clean.replace(/\b(gral|av|dr|pje)\b\.?/gi, m => {
                const l = m.toLowerCase();
                if (l.startsWith('g')) return 'General';
                if (l.startsWith('a')) return 'Avenida';
                if (l.startsWith('d')) return 'Doctor';
                if (l.startsWith('p')) return 'Pasaje';
                return m;
            });

            if (level === 0) {
                clean = clean.replace(/\s+al\s+(\d+)/gi, ' $1');
                clean = clean.replace(/\d+°\s*[a-zA-Z]?/gi, '');
                clean = clean.replace(/piso\s*\d+/gi, '');
                clean = clean.replace(/depto\s*[a-zA-Z0-9]+/gi, '');
                clean = clean.replace(/\s+/g, ' ').trim();
            } else if (level === 1) {
                clean = clean.replace(/\s+al\s+\d+/gi, '');
                clean = clean.replace(/\s+\d+/g, '');
                clean = clean.replace(/piso\s*\d+/gi, '');
                clean = clean.replace(/depto\s*[a-zA-Z0-9]+/gi, '');
                clean = clean.replace(/\s+/g, ' ').trim();
            } else {
                const parts = clean.split(','); 
                clean = parts.length > 1 ? parts[parts.length - 1].trim() : clean;
            }

            if (!clean.toLowerCase().includes("buenos aires") && !clean.toLowerCase().includes("capital")) {
                clean += ", Buenos Aires, Argentina";
            }
            return clean;
        }

        async function geocodeQuery(queryStr) {
            if (!queryStr) return null;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryStr)}`);
                if (!res.ok) return null;
                const data = await res.json();
                if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
            } catch(e) {}
            return null;
        }

        async function geocodeAddressWithFallbacks(p) {
            if (p.latitude && p.longitude) return { lat: parseFloat(p.latitude), lon: parseFloat(p.longitude), approx: false };
            let coords = await geocodeQuery(sanitizeAddressForGeocoding(p.direccion, 0));
            if (coords) return { ...coords, approx: false };
            await new Promise(r => setTimeout(r, 400));
            coords = await geocodeQuery(sanitizeAddressForGeocoding(p.direccion, 1));
            if (coords) return { ...coords, approx: true };
            await new Promise(r => setTimeout(r, 400));
            coords = await geocodeQuery(sanitizeAddressForGeocoding(p.direccion, 2));
            if (coords) return { lat: coords.lat + (Math.random() - 0.5) * 0.008, lon: coords.lon + (Math.random() - 0.5) * 0.008, approx: true };
            
            const isCaba = isCabaAddress(p.direccion);
            const baseLat = isCaba ? -34.5800 : -34.5085;
            const baseLon = isCaba ? -58.4700 : -58.4988;
            return { lat: baseLat + (Math.random() - 0.5) * 0.015, lon: baseLon + (Math.random() - 0.5) * 0.015, approx: true };
        }

        function generateGpsLink(p) {
            let dest = p.direccion || "";
            dest = dest.replace(/\b[a-zA-Z]\d{4}[a-zA-Z]{0,3}\b/g, '').replace(/\s+/g, ' ').trim();
            if (dest === "Dirección no especificada" || dest === "") {
                if (p.latitude && p.longitude) dest = `${p.latitude},${p.longitude}`;
            } else {
                if(!dest.toLowerCase().includes("buenos aires") && !dest.toLowerCase().includes("capital")) {
                    dest += ", Buenos Aires, Argentina";
                }
            }
            return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}`;
        }

        function generateWaLink(p) {

        function parseNumericVal(str) { return parseInt(String(str).replace(/[^0-9]/g, ''), 10) || 0; }
        
        function parseFloatVal(str) {
            if (!str) return 999999;
            let num = parseFloat(str.toLowerCase().replace(',', '.').replace(/[^0-9.]/g, ''));
            return isNaN(num) ? 999999 : (str.toLowerCase().includes('m') && !str.toLowerCase().includes('km') ? num / 1000 : num);
        }

        function getCurrency(str) {
            const upper = String(str).toUpperCase();
            return (upper.includes("USD") || upper.includes("U$S") || upper.includes("US$")) ? "USD" : "$";
        }

        function formatMoney(num, currency) { return `${currency === 'USD' ? 'US$' : '$'} ${num.toLocaleString('es-AR')}`; }

        function getTotalUsdHtml(precioStr, expensasStr) {
            if (!precioStr || dolarBlueRate <= 0) return "";
            const precio = parseNumericVal(precioStr), expensas = parseNumericVal(expensasStr) || 0;
            const pCurr = getCurrency(precioStr), eCurr = getCurrency(expensasStr);
            if (precio <= 0) return "";
            let total = (pCurr === 'USD') ? precio : (precio / dolarBlueRate);
            if (expensas > 0) total += (eCurr === 'USD') ? expensas : (expensas / dolarBlueRate);
            if (pCurr === 'USD' && expensas === 0) return "";
            return `<span class="badge-usd-sub">(~US$ ${Math.round(total).toLocaleString('es-AR')})</span>`;
        }

        function generateCostsHtml(precioStr, direccionStr) {
            const alquiler = parseNumericVal(precioStr);
            if (alquiler === 0) return '';
            const currency = getCurrency(precioStr);
            const isCaba = isCabaAddress(direccionStr);
            const comision = isCaba ? 0 : (alquiler * 24 * 0.05);
            return `
                <div class="entry-costs">
                    <h4>Ingreso ${isCaba ? '<span style="color:var(--whatsapp); text-transform:none; margin-left:4px;">(CABA)</span>' : ''}</h4>
                    <div class="entry-costs-grid">
                        <div class="cost-item"><span>Depósito (1m):</span> <strong>${formatMoney(alquiler, currency)}</strong></div>
                        ${!isCaba ? `<div class="cost-item"><span>Comisión (5%):</span> <strong>${formatMoney(comision, currency)}</strong></div>` : ''}
                        <div class="cost-item cost-item-total"><span>Total:</span> <strong>${formatMoney(alquiler + comision, currency)}</strong></div>
                    </div>
                </div>
            `;
        }

        function getFilteredProperties() {
            const s = filterText.value.toLowerCase(), t = filterType.value, c = filterCurrency.value;
            return globalState.properties.filter(p => {
                const matchTxt = (p.direccion || "").toLowerCase().includes(s) || (p.tipo || "").toLowerCase().includes(s);
                const matchType = t === "ALL" || (p.tipo || "").includes(t);
                const isUsd = (p.precio || "").toUpperCase().includes("US");
                const matchCurr = c === "ALL" ? true : (c === "USD" ? isUsd : !isUsd);
                return matchTxt && matchType && matchCurr;
            });
        }

        function renderList() {
            const sortTerm = sortType.value;
            let processedProps = getFilteredProperties();

            if (sortTerm !== 'date_desc') {
                processedProps.sort((a, b) => {
                    if (sortTerm === 'ranking_desc') return (b.ranking || 0) - (a.ranking || 0);
                    if (sortTerm === 'dist_asc') return parseFloatVal(a.distancia_cole) - parseFloatVal(b.distancia_cole);
                    if (sortTerm === 'price_asc') return parseNumericVal(a.precio) - parseNumericVal(b.precio);
                    if (sortTerm === 'price_desc') return parseNumericVal(b.precio) - parseNumericVal(a.precio);
                    if (sortTerm === 'rooms_desc') return parseNumericVal(b.ambientes) - parseNumericVal(a.ambientes);
                    if (sortTerm === 'sqm_desc') return parseNumericVal(b.metros_tot) - parseNumericVal(a.metros_tot);
                    return 0;
                });
            }

            if (processedProps.length === 0) {
                list.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:40px;grid-column:1/-1;">No hay resultados.</div>';
                return;
            }
            
            list.innerHTML = processedProps.map(p => {
                const mk = (lbl, val) => (!val || val === "N/A" || val === "") ? "" : `<div class="badge"><span>${lbl}</span><strong>${val}</strong></div>`;
                const schoolData = (p.distancia_cole || p.tiempo_cole) ? `${p.distancia_cole} | ${p.tiempo_cole}` : `<span style="color:var(--accent);">+ Colegio</span>`;
                const hasExp = p.expensas && p.expensas !== "N/A" && p.expensas !== "0" && p.expensas !== "$0";
                const stars = [1,2,3,4,5].map(s => `<span class="star ${s <= (p.ranking || 0) ? 'active' : ''}" onclick="setRanking('${p.id}', ${s})">★</span>`).join('');
                const escapedAddress = (p.direccion || "").replace(/'/g, "\\'");

                return `
                <div class="card">
                    ${p.imagen ? `<img src="${p.imagen}" class="card-img" alt="Preview">` : `<div class="card-img" style="display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:0.85rem;font-weight:600;">SIN IMAGEN</div>`}
                    <div class="card-content">
                        <div class="card-header">
                            <div style="min-width:0; flex:1;">
                                <div class="prop-title">${p.tipo}</div>
                                <div class="prop-address" onclick="openAddressInGoogleMaps('${escapedAddress}')">📍 ${p.direccion}</div>
                            </div>
                            <div class="star-rating" style="flex-shrink:0;">${stars}</div>
                        </div>
                        <div class="metrics-grid">
                            <div class="badge highlight">
                                <span>Valor</span> 
                                <div style="text-align: right;">
                                    <strong>${p.precio}</strong>
                                    ${hasExp ? `<span style="font-size:0.75rem; font-weight:500; color:var(--accent); display:block; line-height:1;">+ ${p.expensas} exp.</span>` : ''}
                                    ${getTotalUsdHtml(p.precio, p.expensas)}
                                </div>
                            </div>
                            <div class="badge badge-interactive" onclick="updateSchoolData('${p.id}')">
                                <span>Ruta Escolar</span> <strong>${schoolData}</strong>
                            </div>
                            ${mk("Totales", p.metros_tot ? p.metros_tot + ' m²' : null)}
                            ${mk("Amb", p.ambientes)}
                            ${mk("Dorm", p.dormitorios)}
                            ${mk("Baños", p.banos)}
                            ${mk("Coch", p.cocheras)}
                        </div>
                        ${generateCostsHtml(p.precio, p.direccion)}
                        
                        <label class="itinerary-toggle">
                            <input type="checkbox" ${itineraryIds.has(p.id) ? 'checked' : ''} onchange="toggleItinerary('${p.id}')">
                            Incluir en Itinerario de Visita
                        </label>
                        
                        <div class="card-actions">
                            <a href="${generateWaLink(p)}" target="_blank" class="wa-btn">WA</a>
                            <a href="${generateGpsLink(p)}" target="_blank" class="school-btn">GPS</a>
                            <a href="${p.url}" target="_blank" class="link-btn">Ver</a>
                            <button onclick="editProperty('${p.id}')" class="action-btn edit-btn">Editar</button>
                            <button onclick="deleteProperty('${p.id}')" class="action-btn delete-btn">Borrar</button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        window.addEventListener('online', () => { fetchDolarRate(); autoPullFromCloud(); });
        window.addEventListener('offline', () => { updateSyncStatus(); });
        document.addEventListener("visibilitychange", async () => {
            if (!document.hidden && navigator.onLine) await autoPullFromCloud();
        });
    </script>
</body>
</html>
